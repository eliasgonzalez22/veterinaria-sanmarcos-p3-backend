# ==========================================================
# Microservicio de usuarios - Veterinaria San Marcos
# Los valores sensibles se leen desde variables de entorno.
# Nunca subir claves reales ni archivos .env al repositorio.
# ==========================================================
spring.application.name=ms-usuarios
server.port=${PORT:8081}

# --- Base de datos MySQL (cada microservicio tiene su propia BD) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sanmarcos_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea/actualiza las tablas a partir de las entidades.
# Los datos se conservan al reiniciar (no se usa create-drop).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# JWT_SECRET: minimo 32 caracteres. Si no se define, se genera una clave
# aleatoria al iniciar (los tokens dejan de valer al reiniciar).
jwt.secret=${JWT_SECRET:}
jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# --- CORS: origenes del frontend separados por coma ---
app.cors.origenes=${CORS_ORIGINS:http://localhost:5173}

# --- Usuarios de prueba (solo datos de demostracion) ---
app.seed.habilitado=${SEED_HABILITADO:true}
app.seed.clave=${SEED_CLAVE:123456}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
